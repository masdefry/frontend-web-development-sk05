<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="grid.css" />
  </head>
  <body>
    <!-- 
        Grid adalah sistem layout (tata letak) dalam CSS yang digunakan untuk menyusun elemen-elemen 
        di dalam sebuah container ke dalam baris (rows) dan kolom (columns) secara dua dimensi.

        📝 Grid mirip seperti tabel Excel, berguna untuk menyusun elemen dalam bentuk kotak-kotak 
        yang terstruktur. 
        
        🔹 Istilah Penting di Grid
            > display: grid	            > Mengaktifkan grid
            > grid-template-columns	    > Mengatur jumlah & ukuran kolom
            > grid-template-rows	      > Mengatur jumlah baris
            > gap	                      > Mengatur serta memberi jarak antar item
            > grid-column	              > Mengatur lebar item
            > grid-row	                  > Mengatur tinggi item
    -->

    <div id="wrapper-01">
      <div>01</div>
      <div>02</div>
      <div class="row-02">03</div>
      <div class="row-02">04</div>
      <div class="row-02">05</div>
      <div>06</div>
      <div>07</div>
      <div>08</div>
      <div>09</div>
      <div>10</div>
      <div>11</div>
    </div>

    <div id="wrapper-02">
      <div>01</div>
      <div>02</div>
      <div>03</div>
      <div>04</div>
      <div>05</div>
      <div>06</div>
      <div>07</div>
      <div>08</div>
      <div>09</div>
    </div>
  </body>
</html>
