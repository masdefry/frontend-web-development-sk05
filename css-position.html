<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css-position.css" />
  </head>
  <body>
    <!-- 
        RELATIVE
        Elemen tetap berada dalam alur normal dokumen, 
        tetapi bisa digeser relatif terhadap posisi aslinya.

        🔹 Karakteristik
            > Masih mempertahankan ruang aslinya
            > Bisa menggunakan top, left, right, bottom
            > Sering di jadikan referensi parent untuk position absolute
    -->
    <div id="position-relative">
      <div>Box-01</div>
      <div id="box-02">Box-02</div>
      <div>Box-03</div>
    </div>

    <!-- 
        ABSOLUTE
        Elemen keluar dari posisi normal dan 
        diposisikan relatif terhadap parent terdekat 
        yang memiliki position selain static.    

        🔹 Karakteristik
            > Tidak mempertahankan ruang asli nya (keluar dari normal flow)
            > Bisa dikontrol penuh dengan top, left, dll
            > Jika tidak ada parent ber-position non-static → relatif ke <body>
    -->
    <div id="position-absolute">
      <div>Box-01</div>
      <div id="box-02">Box-02</div>
      <div>Box-03</div>
    </div>

    <!-- 
        FIXED
        Elemen diposisikan relatif terhadap viewport (layar browser).

        🔹 Karakteristik
            > Tidak terpengaruh scroll
            > Selalu berada di posisi yang sama di layar
            > Keluar dari normal flow
    -->
    <div id="navbar">

    </div>

    <div id="position-sticky">

    </div>
